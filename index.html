<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Historical GIS Portal</title>
  <style>
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header{ padding:24px 16px; border-bottom:1px solid #eee; }
    .wrap{ max-width: 980px; margin: 0 auto; }
    h1{ margin:0 0 8px; }
    .desc{ color:#444; line-height:1.5; }
    .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:14px; padding:16px; }
    .card{ border:1px solid #ddd; border-radius:12px; overflow:hidden; background:#fff; }
    .thumb{ height:140px; background:#f3f3f3; display:flex; align-items:center; justify-content:center; color:#777; }
    .card .body{ padding:12px; }
    .title{ font-weight:800; margin:0 0 6px; }
    .meta{ margin:0 0 10px; color:#555; font-size:13px; line-height:1.4; }
    .btns{ display:flex; gap:8px; flex-wrap:wrap; }
    a.btn{ display:inline-block; padding:8px 10px; border-radius:10px; border:1px solid #bbb; text-decoration:none; color:#111; font-weight:600; font-size:13px; }
    a.btn.primary{ background:#111; color:#fff; border-color:#111; }
    footer{ padding:18px 16px; color:#666; font-size:12px; border-top:1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Historical GIS Portal</h1>
      <p class="desc">
        청대 만주(동북) 관련 역사 GIS 주제도를 모아둔 포털입니다. 각 카드에서 지도를 열람할 수 있습니다.
      </p>
    </div>
  </header>

  <main class="wrap">
    <section class="grid">
      <article class="card">
        <div class="thumb">Thumbnail</div>
        <div class="body">
          <p class="title">Qing Manchu Map</p>
          <p class="meta">CHGIS(1820) 경계/지명 레이어 + 위성/OSM 전환</p>
          <div class="btns">
            <a class="btn primary" href="https://mucenfere.github.io/historymap_of_qing_manchu/">Open Map</a>
            <a class="btn" href="https://github.com/mucenfere/historymap_of_qing_manchu">Repo</a>
          </div>
        </div>
      </article>

    </section>
  </main>

  <footer>
    <div class="wrap">© mucenfere · 자료/방법은 각 지도 페이지에서 확인</div>
  </footer>
</body>
</html>
